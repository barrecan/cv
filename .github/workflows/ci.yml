name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate static site
        run: |
          test -f index.html
          test -f CNAME
          test -f .nojekyll
          test -f sitemap.xml
          test -f robots.txt
          test -f static/css/layout.css
          grep -q "Nick Barreca" index.html
          grep -q "barrecan.com" CNAME
